<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1008" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Columbus" />
  <title>Columbus</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <!-- Camera feed (background) -->
  <video id="camera" autoplay playsinline muted></video>

  <!-- AR overlay canvas -->
  <canvas id="overlay"></canvas>

  <!-- Desktop bearing slider (shown when no compass available) -->
  <div id="slider-wrap" style="display:none;">
    <label for="bearing-slider">Bearing</label>
    <input id="bearing-slider" type="range" min="0" max="359" value="305" step="1" />
    <span id="slider-value">305°</span>
  </div>

  <!-- Splash screen -->
  <div id="splash">
    <div class="splash-inner">
      <div class="splash-title">
        <span class="splash-compass">✦</span>
        <h1>COLUMBUS</h1>
        <p class="splash-sub">Point at the horizon.<br />Discover your landfall.</p>
      </div>
      <div id="error-msg" style="display:none;"></div>
      <button id="begin-btn">Begin</button>
      <p class="splash-note">Requires camera, compass &amp; location</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
